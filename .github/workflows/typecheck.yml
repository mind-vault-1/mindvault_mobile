name: Typecheck & Dependency Validation

on:
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Validates Expo dependency versions and project config.
      # Runs on hosted Linux runners and needs no native build credentials
      # (no Xcode signing, no Android keystore, no EAS token).
      - name: Validate Expo dependencies
        run: npm run validate-deps

      - name: Typecheck
        run: npm run typecheck
