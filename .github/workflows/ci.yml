name: CI

on:
  push:
    # Scoped to main only: pull_request already re-runs on every commit
    # pushed to a branch with an open PR (via GitHub's default
    # "synchronize" event), so this only needs to cover pushes that have
    # no open PR — direct pushes/merges to main.
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job names `typecheck` and `ci` are required status checks on main.
# Renaming a job means updating branch protection in the same change.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Validates Expo dependency versions and project config.
      # Runs on hosted Linux runners and needs no native build credentials
      # (no Xcode signing, no Android keystore, no EAS token).
      - name: Validate Expo dependencies
        run: npm run validate-deps

      - name: Typecheck
        run: npm run typecheck

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

  # Job name `bundle` is a stable, required-status-check-friendly name.
  # Renaming it means updating branch protection in the same change.
  # Runs `expo export` for all platforms without native build credentials:
  # no Xcode signing, no Android keystore, no EAS token. Catches Metro
  # bundling regressions that typecheck alone cannot detect.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Metro
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .expo
          key: ${{ runner.os }}-metro-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-metro-

      - run: npm ci

      - name: Export bundles (android, ios, web)
        run: npx expo export --platform android --platform ios --platform web
