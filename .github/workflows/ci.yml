name: CI

on:
  push:
    # Scoped to main only: pull_request already re-runs on every commit
    # pushed to a branch with an open PR (via GitHub's default
    # "synchronize" event), so this only needs to cover pushes that have
    # no open PR — direct pushes/merges to main.
    branches: ["main"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true
